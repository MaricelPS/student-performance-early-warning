name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -c requirements.lock -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (synthetic fixtures, no dataset needed)
        run: pytest --cov=early_warning --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t early-warning-api:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 early-warning-api:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"user_uuid":"u","course_uuid":"c","day":45,"exams":[{"exam_code":"P1","particion":27,"grade":4}]}'
          docker rm -f api
